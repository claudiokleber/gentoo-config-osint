[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gentoosint"
version = "0.2.0"
description = "Diagnóstico e planejamento modular de segurança para Gentoo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gentoosint = "gentoosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
